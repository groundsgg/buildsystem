name: Build main

on: [ push, pull_request ]

jobs:
  build:
    # Blacksmith, not GitHub's runners: the whole org builds here. Two vCPU is the house size
    # for Gradle jobs — Blacksmith bills per full minute and linearly in vCPU, so a wider
    # runner only pays off if it actually shortens wall-clock.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        java: [ 25 ]
      fail-fast: true

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean build
