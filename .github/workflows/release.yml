name: Release

# Ours, not upstream's. `publish.yml` next door pushes upstream's coordinates to Sonatype and is
# fenced to their owner id, so it can never fire here — this builds the two jars a build server
# actually installs and attaches them to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # -Pversion rather than an edit to gradle.properties: that file belongs to upstream, and
      # every line of it we change is a line a future merge has to argue about.
      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean build -Pversion=${{ steps.version.outputs.version }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/libs/BuildSystem-${{ steps.version.outputs.version }}.jar
            build/libs/GroundsMaps-${{ steps.version.outputs.version }}.jar
