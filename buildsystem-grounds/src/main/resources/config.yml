# The map registry, on the shared API origin. Not an in-cluster address: the registry runs on
# core and the build server does not, so `svc.cluster.local` resolves to nothing here — which is
# the same reason authentication is Keycloak rather than a ServiceAccount token.
registry:
  base-url: "https://api.grounds.gg"
  # First-party public map CDN (pin files + bundles). Not the API origin.
  cdn-base-url: "https://maps.grounds.gg"

oidc:
  issuer-url: "https://account.grounds.gg/realms/grounds"
  token-url: "https://account.grounds.gg/realms/grounds/protocol/openid-connect/token"
  # Public client for `/map login`. The same one `grounds login` uses, so a builder signs in
  # with a screen they have already seen — and no secret has to exist for it.
  device-client-id: "grounds-cli"
  # The build server's own service-account client. Its secret comes from the environment
  # (GROUNDS_MAPS_CLIENT_SECRET), never from this file — a config a builder can read is not
  # a place for a credential that may publish.
  client-id: "buildserver-maps"

# `/map import <https-url> <world>`: a world someone else made, fetched from a URL.
import:
  # Hosts an import may come from; a subdomain of a listed host counts. Empty allows any host
  # whose every address is public — internal and private addresses are refused either way.
  allowed-hosts: []
  # The download itself, and what it may unpack to. A zip of a few megabytes can expand to
  # gigabytes, so the second limit is the one that protects the disk.
  max-download-mib: 512
  max-unpacked-mib: 2048
  max-entries: 100000
