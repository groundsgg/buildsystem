# The map registry, on the shared API origin. Not an in-cluster address: the registry runs on
# core and the build server does not, so `svc.cluster.local` resolves to nothing here — which is
# the same reason authentication is Keycloak rather than a ServiceAccount token.
registry:
  base-url: "https://api.grounds.gg"

oidc:
  token-url: "https://account.grounds.gg/realms/grounds/protocol/openid-connect/token"
  # The build server's own service-account client. Its secret comes from the environment
  # (GROUNDS_MAPS_CLIENT_SECRET), never from this file — a config a builder can read is not
  # a place for a credential that may publish.
  client-id: "buildserver-maps"
